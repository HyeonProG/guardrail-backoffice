# 애플리케이션 기본 정보
spring:
  application:
    name: guardrail

  # PostgreSQL 데이터소스 설정
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/guardrail}
    username: ${DB_USERNAME:guardrail}
    password: ${DB_PASSWORD:guardrail}

  # 안정적인 API 동작을 위한 JPA/Hibernate 기본 설정
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 100

  # JSON 직렬화 기본 타임존
  jackson:
    time-zone: Asia/Seoul

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:test-openai-key}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-5.4-mini}
          temperature: 0.2

# 내장 서버 설정
server:
  port: ${PORT:8080}
  shutdown: graceful

# OpenAPI 문서 엔드포인트 설정
springdoc:
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  default-produces-media-type: application/json

# 로컬 백엔드 개발용 로그 기본 설정
logging:
  level:
    root: info
    com.hyeon.guardrail: debug
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: debug

# JWT 토큰 설정
jwt:
  secret-key: ${JWT_SECRET_KEY:test-jwt-secret-key-test-jwt-secret-key}
  access-token-expiration-seconds: 1800
  refresh-token-expiration-seconds: 1209600

# 프로젝트 전용 커스텀 설정
app:
  api:
    version: 1.0.2

  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://guardrail-backoffice.vercel.app}

  upload:
    max-file-size-mb: 10
    allowed-content-types: image/jpeg,image/png,image/webp

  storage:
    s3:
      bucket: ${AWS_S3_BUCKET:guardrail-backoffice}
      region: ${AWS_REGION:ap-northeast-2}
      endpoint: ${AWS_S3_ENDPOINT:}
      access-key: ${AWS_ACCESS_KEY_ID:test-access-key}
      secret-key: ${AWS_SECRET_ACCESS_KEY:test-secret-key}
      public-base-url: ${AWS_S3_PUBLIC_BASE_URL:https://guardrail-backoffice.s3.ap-northeast-2.amazonaws.com}

  ai:
    enabled: true

  product:
    description:
      min-length: 50
      max-length: 2000
