name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API docs
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 30 https://guardrail-backoffice.onrender.com/api-docs > /dev/null; then
              exit 0
            fi
            sleep 20
          done
          exit 1
