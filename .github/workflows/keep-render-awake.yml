name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping Render health check
        run: |
          HEALTH_URL="https://guardrail-backoffice.onrender.com/api/v1/health"

          for attempt in 1 2 3 4 5 6; do
            echo "Ping Render health check: attempt ${attempt}/6"

            if curl -fsS --connect-timeout 10 --max-time 45 "${HEALTH_URL}" > /dev/null; then
              echo "Render health check succeeded."
              exit 0
            fi

            if [ "${attempt}" -lt 6 ]; then
              sleep 15
            fi
          done

          echo "Render health check failed after retries."
          exit 1
