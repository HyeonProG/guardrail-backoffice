name: Verify Harness

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore application.yml from secret
        env:
          APPLICATION_YML: ${{ secrets.APPLICATION_YML }}
        run: |
          test -n "$APPLICATION_YML" || {
            echo "APPLICATION_YML secret is not configured.";
            exit 1;
          }
          mkdir -p src/main/resources
          printf '%s' "$APPLICATION_YML" > src/main/resources/application.yml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make scripts executable
        run: chmod +x ./scripts/verify.sh ./gradlew

      - name: Verify all
        run: ./scripts/verify.sh all
